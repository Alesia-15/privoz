<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!doctype html>
    <html lang="ru">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>PRIVOZ Network</title>

        <link rel="stylesheet" href="style.css" />
      </head>

      <body>
        <div class="privoz-network" id="privozNetwork">
          <svg
            class="privoz-network__svg"
            viewBox="0 0 820 660"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-label="Международная торговая сеть PRIVOZ"
          >
            <defs>
              <!-- мягкое оранжевое свечение -->
              <filter
                id="orangeGlow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
              >
                <feGaussianBlur stdDeviation="4" result="blur" />

                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>

              <!-- лёгкое белое свечение -->
              <filter
                id="whiteGlow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
              >
                <feGaussianBlur stdDeviation="2" result="blur" />

                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>

              <!-- градиент главной карточки -->
              <linearGradient id="mainCardGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff8a35" stop-opacity=".28" />

                <stop offset="100%" stop-color="#ff6b00" stop-opacity=".08" />
              </linearGradient>
            </defs>

            <!-- =====================================================
             ЛИНИИ СЕТИ
        ====================================================== -->

            <g class="network-lines">
              <!-- внешний контур -->
              <line data-from="manufacturer" data-to="search" />
              <line data-from="search" data-to="client" />
              <line data-from="client" data-to="warehouse" />
              <line data-from="warehouse" data-to="customs" />
              <line data-from="customs" data-to="logistics" />
              <line data-from="logistics" data-to="purchase" />
              <line data-from="purchase" data-to="inspection" />
              <line data-from="inspection" data-to="manufacturer" />

              <!-- центр -->
              <line data-from="manufacturer" data-to="privoz" />
              <line data-from="search" data-to="privoz" />
              <line data-from="client" data-to="privoz" />
              <line data-from="warehouse" data-to="privoz" />
              <line data-from="customs" data-to="privoz" />
              <line data-from="logistics" data-to="privoz" />
              <line data-from="purchase" data-to="privoz" />
              <line data-from="inspection" data-to="privoz" />

              <!-- дополнительные пересечения -->
              <line data-from="manufacturer" data-to="purchase" />
              <line data-from="manufacturer" data-to="inspection" />
              <line data-from="manufacturer" data-to="warehouse" />

              <line data-from="search" data-to="inspection" />
              <line data-from="search" data-to="purchase" />

              <line data-from="client" data-to="logistics" />
              <line data-from="client" data-to="customs" />

              <line data-from="warehouse" data-to="logistics" />
              <line data-from="warehouse" data-to="purchase" />

              <line data-from="customs" data-to="purchase" />
              <line data-from="inspection" data-to="logistics" />
            </g>

            <!-- =====================================================
             МАЛЕНЬКИЕ УЗЛЫ
        ====================================================== -->

            <g class="minor-network">
              <g class="minor-node" data-base-x="235" data-base-y="265">
                <rect x="-5" y="-5" width="10" height="10" />
              </g>

              <g class="minor-node" data-base-x="335" data-base-y="185">
                <rect x="-4" y="-4" width="8" height="8" />
              </g>

              <g class="minor-node" data-base-x="475" data-base-y="190">
                <rect x="-4" y="-4" width="8" height="8" />
              </g>

              <g class="minor-node" data-base-x="585" data-base-y="280">
                <rect x="-5" y="-5" width="10" height="10" />
              </g>

              <g class="minor-node" data-base-x="565" data-base-y="430">
                <rect x="-4" y="-4" width="8" height="8" />
              </g>

              <g class="minor-node" data-base-x="420" data-base-y="505">
                <rect x="-5" y="-5" width="10" height="10" />
              </g>

              <g class="minor-node" data-base-x="265" data-base-y="445">
                <rect x="-4" y="-4" width="8" height="8" />
              </g>
            </g>

            <!-- =====================================================
             ПРОИЗВОДИТЕЛЬ
        ====================================================== -->

            <g
              id="manufacturer"
              class="network-node network-node--large"
              transform="translate(245 140)"
            >
              <text class="node-label" x="0" y="-80" text-anchor="middle">
                Производитель
              </text>

              <g class="node-card">
                <rect x="-49" y="-49" width="98" height="98" rx="9" />
              </g>

              <g class="node-icon">
                <path
                  d="
                M-25 -4
                V-25
                L-10 -15
                V-25
                L5 -15
                V-4
              "
                />

                <rect x="-25" y="-4" width="53" height="32" />

                <rect x="-15" y="7" width="7" height="7" />

                <rect x="-2" y="7" width="7" height="7" />

                <rect x="11" y="7" width="7" height="7" />
              </g>
            </g>

            <!-- =====================================================
             AI SEARCH
        ====================================================== -->

            <g
              id="search"
              class="network-node network-node--small"
              transform="translate(110 255)"
            >
              <text class="node-label" x="0" y="-55" text-anchor="middle">
                AI-поиск
              </text>

              <g class="node-card">
                <rect x="-32" y="-32" width="64" height="64" rx="7" />
              </g>

              <g class="node-icon">
                <circle cx="-4" cy="-4" r="11" />

                <line x1="5" y1="5" x2="16" y2="16" />
              </g>
            </g>

            <!-- =====================================================
             ПРОВЕРКА
        ====================================================== -->

            <g
              id="inspection"
              class="network-node network-node--small"
              transform="translate(520 145)"
            >
              <text class="node-label" x="0" y="-55" text-anchor="middle">
                Проверка
              </text>

              <g class="node-card">
                <rect x="-34" y="-34" width="68" height="68" rx="7" />
              </g>

              <g class="node-icon">
                <circle cx="0" cy="0" r="15" />

                <path d="M-8 0 L-2 7 L10 -8" />
              </g>
            </g>

            <!-- =====================================================
             ЗАКУПКА
        ====================================================== -->

            <g
              id="purchase"
              class="network-node network-node--medium"
              transform="translate(690 275)"
            >
              <text class="node-label" x="0" y="-67" text-anchor="middle">
                Закупка
              </text>

              <g class="node-card">
                <rect x="-43" y="-43" width="86" height="86" rx="8" />
              </g>

              <g class="node-icon">
                <path
                  d="
                M-24 -12
                H-16
                L-9 15
                H19
                L25 -5
                H-6
              "
                />

                <circle cx="-4" cy="24" r="3.5" />

                <circle cx="17" cy="24" r="3.5" />
              </g>
            </g>

            <!-- =====================================================
             PRIVOZ
        ====================================================== -->

            <g
              id="privoz"
              class="network-node network-node--main"
              transform="translate(405 335)"
            >
              <g class="node-card node-card--main">
                <rect x="-60" y="-60" width="120" height="120" rx="11" />
              </g>

              <g class="privoz-logo" transform="translate(0 -5)">
                <polygon points="-42,-20 22,-20 22,-12 -26,-12" />
                <polygon points="-28,-9 22,-9 22,-1 -12,-1" />
                <polygon points="-14,2 22,2 22,10 2,10" />
              </g>

              <text class="privoz-label" x="0" y="30" text-anchor="middle">
                PRIVOZ
              </text>
            </g>

            <!-- =====================================================
             ЛОГИСТИКА
        ====================================================== -->

            <g
              id="logistics"
              class="network-node network-node--large"
              transform="translate(650 455)"
            >
              <text class="node-label" x="0" y="-70" text-anchor="middle">
                Логистика
              </text>

              <g class="node-card">
                <rect x="-48" y="-48" width="96" height="96" rx="9" />
              </g>

              <g class="node-icon">
                <rect x="-29" y="-13" width="36" height="25" />

                <path
                  d="
                M7 -6
                H20
                L29 5
                V13
                H7
                Z
              "
                />

                <circle cx="-17" cy="18" r="5" />

                <circle cx="20" cy="18" r="5" />
              </g>
            </g>

            <!-- =====================================================
             ТАМОЖНЯ
        ====================================================== -->

            <g
              id="customs"
              class="network-node network-node--small"
              transform="translate(500 560)"
            >
              <text class="node-label" x="15" y="60">Таможня</text>

              <g class="node-card">
                <rect x="-34" y="-34" width="68" height="68" rx="7" />
              </g>

              <g class="node-icon">
                <path d="M0 -23 L23 -10 H-23 Z" />

                <line x1="-17" y1="-8" x2="17" y2="-8" />

                <line x1="-13" y1="-8" x2="-13" y2="16" />

                <line x1="0" y1="-8" x2="0" y2="16" />

                <line x1="13" y1="-8" x2="13" y2="16" />

                <line x1="-20" y1="16" x2="20" y2="16" />
              </g>
            </g>

            <!-- =====================================================
             СКЛАД
        ====================================================== -->

            <g
              id="warehouse"
              class="network-node network-node--medium"
              transform="translate(290 560)"
            >
              <text class="node-label" x="0" y="65" text-anchor="middle">
                Склад
              </text>

              <g class="node-card">
                <rect x="-40" y="-40" width="80" height="80" rx="8" />
              </g>

              <g class="node-icon">
                <path d="M-28 -8 L0 -25 L28 -8" />

                <rect x="-23" y="-8" width="46" height="32" />

                <rect x="-9" y="5" width="18" height="19" />
              </g>
            </g>

            <!-- =====================================================
             КЛИЕНТ
        ====================================================== -->

            <g
              id="client"
              class="network-node network-node--small"
              transform="translate(105 450)"
            >
              <text class="node-label" x="0" y="60" text-anchor="middle">
                Клиент
              </text>

              <g class="node-card">
                <rect x="-33" y="-33" width="66" height="66" rx="7" />
              </g>

              <g class="node-icon">
                <circle cx="0" cy="-10" r="9" />

                <path
                  d="
                M-18 20
                C-17 6 -9 1 0 1
                C9 1 17 6 18 20
              "
                />
              </g>
            </g>

            <!-- =====================================================
             ДВИЖУЩИЕСЯ ОБЪЕКТЫ
             JS создаёт их здесь
        ====================================================== -->

            <g class="moving-objects"></g>
          </svg>
        </div>

        <script src="script.js"></script>
      </body>
    </html>
    <script src="script.js"></script>
  </body>
</html>
